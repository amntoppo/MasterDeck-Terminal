name: Native helpers
description: >-
  whisper-cli and md-mute for both Mac arches into app/resources/, restored from the cache when
  their sources did not change and built (whisper.sh, mute.sh) only on a miss. macOS only.
runs:
  using: composite
  steps:
    # whisper.sh pins whisper.cpp's tag and commit, so its hash names the binary.
    - uses: actions/cache@v4
      id: whisper
      with:
        path: |
          app/resources/whisper/arm64
          app/resources/whisper/x64
        key: whisper-cli-${{ runner.os }}-${{ hashFiles('app/scripts/whisper.sh') }}
    - name: Build whisper-cli (meetings' speech engine)
      if: steps.whisper.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app
      run: |
        command -v cmake >/dev/null || brew install cmake
        ./scripts/whisper.sh arm64
        ./scripts/whisper.sh x64
    - uses: actions/cache@v4
      id: mute
      with:
        path: |
          app/resources/mute/arm64
          app/resources/mute/x64
        key: md-mute-${{ runner.os }}-${{ hashFiles('app/scripts/mute.sh', 'app/native/mute/**') }}
    - name: Build md-mute (meetings' mute reader)
      if: steps.mute.outputs.cache-hit != 'true'
      shell: bash
      working-directory: app
      run: |
        ./scripts/mute.sh arm64
        ./scripts/mute.sh x64
    # A cache entry is trusted no further than this: each binary is there and its signature holds.
    - name: Check the helpers
      shell: bash
      working-directory: app
      run: |
        for f in resources/whisper/arm64/whisper-cli resources/whisper/x64/whisper-cli resources/mute/arm64/md-mute resources/mute/x64/md-mute; do
          [ -x "$f" ] || { echo "::error::$f is missing"; exit 1; }
          codesign --verify "$f"
        done
