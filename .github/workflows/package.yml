name: Package

# A PR's optional packaging check (MasterDeck-Terminal#178): the mac and win installers
# (build.yml, unpublished, kept 7 days) only when the PR changes what they are built from
# (app/scripts/ci-changes.mjs `package`: electron-builder.yml, app/build, app/native, whisper.sh,
# mute.sh, the build workflow and actions, app/package.json's dependencies, the lock) or has the
# `build` label. Not a required check. Run workflow builds any branch.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels the older build. Adding another label must not: such a run gets a group of
# its own and builds nothing.
concurrency:
  group: package-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action != 'labeled' || github.event.label.name == 'build') && 'run' || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.what.outputs.package }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: what
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then echo package=yes | tee -a "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ACTION" = labeled ] && [ "$LABEL" != build ]; then echo package=no | tee -a "$GITHUB_OUTPUT"; exit 0; fi
          # The base's copy decides, as in ci.yml.
          tool="$RUNNER_TEMP/ci-changes.mjs"
          git show "$PR_BASE:app/scripts/ci-changes.mjs" > "$tool" 2>/dev/null || cp app/scripts/ci-changes.mjs "$tool"
          node "$tool" --base "$PR_BASE" --head "$PR_HEAD" --labels "$LABELS" | grep '^package=' | tee -a "$GITHUB_OUTPUT"
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}

  build:
    needs: changes
    if: needs.changes.outputs.package == 'yes'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event.pull_request.head.sha || github.sha }}
      retention-days: 7
