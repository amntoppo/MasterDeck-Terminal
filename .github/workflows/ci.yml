name: CI

# The checks of a pull request (MasterDeck-Terminal#178): the Python tests, typecheck and vitest,
# and actionlint when a workflow changed, on ubuntu, in parallel. No installer or native build: a
# merge to main is built by release.yml (through ota-main.yml, Auto release), and a PR that changes
# packaging files (or has the `build` label) gets package.yml's builds. `changes`
# (app/scripts/ci-changes.mjs) decides what runs; a docs-only PR runs nothing heavy. The job **CI**
# is the one required check: it fails when any job before it failed or was cancelled.
# docs/OPERATIONS.md § Release.
on:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels its older run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.what.outputs.code }}
      workflows: ${{ steps.what.outputs.workflows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: What changed
        id: what
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MG_BASE"; head="$MG_HEAD" ;;
            *) printf 'code=yes\nworkflows=yes\n' | tee -a "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # The base's copy decides: a PR cannot switch its own tests off by breaking this script.
          tool="$RUNNER_TEMP/ci-changes.mjs"
          git show "$base:app/scripts/ci-changes.mjs" > "$tool" 2>/dev/null || cp app/scripts/ci-changes.mjs "$tool"
          node "$tool" --base "$base" --head "$head" | tee -a "$GITHUB_OUTPUT"
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MG_BASE: ${{ github.event.merge_group.base_sha }}
          MG_HEAD: ${{ github.event.merge_group.head_sha }}

  python:
    needs: changes
    if: needs.changes.outputs.code == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Python tests
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m pytest skills/master/tests -q

  app:
    needs: changes
    if: needs.changes.outputs.code == 'yes'
    runs-on: ubuntu-latest
    env:
      # Secrets cannot be read in a step's `if`. Unset for forks, and until the owner adds the key.
      HAS_BACKEND_KEY: ${{ secrets.BACKEND_DEPLOY_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      # The protocol drift test (#5): app/src/shared/remote.ts against the backend's protocol.ts.
      - uses: actions/checkout@v4
        if: env.HAS_BACKEND_KEY == 'true'
        with:
          repository: ${{ github.repository_owner }}/masterdeck-backend
          ref: master
          path: masterdeck-backend
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          # The key must not stay for npm ci's install scripts and the PR's tests to read.
          persist-credentials: false
          sparse-checkout: src/protocol.ts
          sparse-checkout-cone-mode: false
      - name: No backend checkout
        if: env.HAS_BACKEND_KEY != 'true'
        run: echo "::notice::The protocol drift test is skipped (no BACKEND_DEPLOY_KEY secret). docs/OPERATIONS.md § Release."
      - uses: ./.github/actions/setup-app
      - name: Typecheck
        working-directory: app
        run: npm run typecheck
      - name: Test
        working-directory: app
        run: npm test
        env:
          MASTERDECK_BACKEND: ${{ env.HAS_BACKEND_KEY == 'true' && format('{0}/masterdeck-backend', github.workspace) || '' }}

  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

  ci:
    name: CI
    if: always()
    needs: [changes, python, app, actionlint]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed or was not needed
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
        env:
          NEEDS: ${{ toJSON(needs) }}
