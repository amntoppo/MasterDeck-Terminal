name: CI

# Pull requests only: a merge to main is built, tested and released by ota-main.yml (Auto release)
# through release.yml, and tags by release.yml.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest skills/master/tests -q
      - name: Install
        working-directory: app
        run: npm ci
      - name: Typecheck and test
        working-directory: app
        run: |
          npm run typecheck
          npm test
      - name: Build whisper-cli (meetings' speech engine, macOS only)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          command -v cmake >/dev/null || brew install cmake
          ./scripts/whisper.sh arm64
          ./scripts/whisper.sh x64
      - name: Build md-mute (meetings' mute reader, macOS only)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          ./scripts/mute.sh arm64
          ./scripts/mute.sh x64
      - name: Build installers
        working-directory: app
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: masterdeck-${{ matrix.os }}
          path: |
            app/dist/*.dmg
            app/dist/*.exe
