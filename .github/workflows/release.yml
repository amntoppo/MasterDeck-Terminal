name: Release

# A tag v* builds the installers, attaches them and the update files to the GitHub release, then
# runs ota-release.yml, which publishes the in-app update (signed, app/scripts/release-publish.mjs).
# ci.yml does not run on tags, so a tag is built once. docs/OPERATIONS.md § Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to release (again), like v0.10.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      # A release needs both builds; one failing stops the other (no half release).
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python tests
        run: |
          python -m pip install pytest
          python -m pytest skills/master/tests -q
      - name: Install
        working-directory: app
        run: npm ci
      - name: Typecheck and test
        working-directory: app
        run: |
          npm run typecheck
          npm test
      - name: Build whisper-cli (meetings' speech engine, macOS only)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          command -v cmake >/dev/null || brew install cmake
          ./scripts/whisper.sh arm64
          ./scripts/whisper.sh x64
      - name: Build md-mute (meetings' mute reader, macOS only)
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          ./scripts/mute.sh arm64
          ./scripts/mute.sh x64
      - name: Build installers
        working-directory: app
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: masterdeck-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest*.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      # One folder per build job (artifacts/masterdeck-<os>/).
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check the version
        run: |
          pkg="$(node -p "require('./app/package.json').version")"
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "::error::tag $TAG does not match app/package.json's version $pkg"
            exit 1
          fi
      # The DMGs and EXE for new installs, and the update files (the mac zips, the EXE's blockmap)
      # that ota-release.yml publishes as the in-app update. Attached first, so a live update always
      # has its installers on GitHub.
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # How to install and what's new, on every release; also the in-app update's notes unless
          # .github/releases/v<version>.md exists.
          body_path: .github/release-notes.md
          # A beta tag (v0.10.0-beta.1) is a prerelease, so install.sh's "latest" stays stable.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*-mac.zip
            artifacts/**/*.exe.blockmap

  # A release made with GITHUB_TOKEN starts no other workflow, so its `release: published` event
  # never reaches ota-release.yml: it is called here. Registering the update makes it live for every
  # install, so it comes last.
  ota:
    needs: release
    uses: ./.github/workflows/ota-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
