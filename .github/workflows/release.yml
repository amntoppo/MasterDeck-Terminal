name: Release

# A tag v* builds the installers, attaches them and the update files to the GitHub release, then
# runs ota-release.yml, which publishes the in-app update (signed, app/scripts/release-publish.mjs)
# and checks it (release-smoke.mjs). test (ubuntu) → build (build.yml: mac and win in parallel) →
# release → ota. ci.yml does not run on tags, so a tag is built once. ota-main.yml calls it for
# every merge to main (a tag it pushes with GITHUB_TOKEN starts no workflow). docs/OPERATIONS.md
# § Release.
on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      rollout:
        description: 'Percent of installs that get the update at first (empty: 100)'
        type: string
        required: false
        default: ''
    secrets:
      RELEASE_ADMIN_TOKEN:
        required: true
      RELEASE_SIGNING_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'An existing tag to release (again), like v0.10.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # The tag's commit, not the PR head that passed CI: a merge can differ. Quick, on ubuntu, before
  # any mac/win minute.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-ci.txt
      - name: Python tests
        run: |
          python -m pip install -r .github/requirements-ci.txt
          python -m pytest skills/master/tests -q
      - uses: ./.github/actions/setup-app
      - name: Typecheck and test
        working-directory: app
        run: |
          npm run typecheck
          npm test

  # mac and win in parallel; whisper-cli and md-mute come from the cache unless their sources changed.
  build:
    needs: test
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      # One folder per build job (artifacts/masterdeck-<os>/).
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Check the version
        run: |
          pkg="$(node -p "require('./app/package.json').version")"
          if [ "${TAG#v}" != "$pkg" ]; then
            echo "::error::tag $TAG does not match app/package.json's version $pkg"
            exit 1
          fi
      # The update's notes (.github/releases/<tag>.md, which ota-main.yml writes from the merged
      # PRs) on top of the install text.
      - name: Release text
        run: |
          body="$RUNNER_TEMP/release-body.md"
          : > "$body"
          if [ -f ".github/releases/$TAG.md" ]; then
            cat ".github/releases/$TAG.md" >> "$body"
            echo >> "$body"
          fi
          cat .github/release-notes.md >> "$body"
      # The DMGs and EXE for new installs, and the update files (the mac zips, the EXE's blockmap)
      # that ota-release.yml publishes as the in-app update. Attached first, so a live update always
      # has its installers on GitHub.
      - name: Attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          # What's new and how to install, on every release; also the in-app update's notes unless
          # .github/releases/v<version>.md exists.
          body_path: ${{ runner.temp }}/release-body.md
          # A beta tag (v0.10.0-beta.1) is a prerelease, so install.sh's "latest" stays stable.
          prerelease: ${{ contains(env.TAG, '-') }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.exe
            artifacts/**/*-mac.zip
            artifacts/**/*.exe.blockmap

  # A release made with GITHUB_TOKEN starts no other workflow, so its `release: published` event
  # never reaches ota-release.yml: it is called here. Registering the update makes it live for every
  # install, so it comes last.
  ota:
    needs: release
    uses: ./.github/workflows/ota-release.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      rollout: ${{ inputs.rollout || '' }}
    secrets:
      RELEASE_ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
      RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
