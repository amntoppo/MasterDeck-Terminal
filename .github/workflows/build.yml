name: Build

# The mac and win installers of one commit, in parallel, unpublished (MasterDeck-Terminal#178): the
# DMGs and mac zips (macos-latest, whisper-cli and md-mute from the cache) and the NSIS EXE with
# its blockmap (windows-latest), uploaded as the artifacts masterdeck-macos-latest and
# masterdeck-windows-latest. No tests: release.yml runs them before calling this, ci.yml on PRs.
# Called by release.yml (a release) and package.yml (a PR's packaging check).
on:
  workflow_call:
    inputs:
      ref:
        description: 'The commit, branch or tag to build'
        type: string
        required: true
      retention-days:
        description: 'How long the artifacts are kept'
        type: number
        required: false
        default: 7

permissions:
  contents: read

jobs:
  build:
    strategy:
      # A release needs both builds; one failing stops the other (no half release).
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
          - os: windows-latest
            dist: dist:win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/setup-app
        with:
          electron: 'true'
      - uses: ./.github/actions/native-helpers
        if: runner.os == 'macOS'
      - name: Build installers
        working-directory: app
        run: npm run ${{ matrix.dist }} -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: masterdeck-${{ matrix.os }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          path: |
            app/dist/*.dmg
            app/dist/*.zip
            app/dist/*.exe
            app/dist/*.blockmap
            app/dist/latest*.yml
