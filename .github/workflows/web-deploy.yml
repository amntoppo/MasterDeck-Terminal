name: Web deploy

# The web app (app.masterdeck.dev, the static Worker masterdeck-web) deployed on every push to main
# that changes what it is built from (MasterDeck-Terminal#178): build:web, wrangler deploy, then a
# check that the site serves the index.html just built. A commit status "Web deploy" on the commit;
# on failure a comment on its PR. Skipped with a notice until the secrets CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID are set. Run workflow deploys main by hand. docs/OPERATIONS.md § Web app deploy.
on:
  push:
    branches: [main]
    paths:
      - 'app/src/web/**'
      - 'app/src/renderer/**'
      - 'app/src/shared/**'
      - 'app/web/**'
      - 'app/vite.web.config.ts'
      - 'app/package.json'
      - 'app/package-lock.json'
      - '!**/*.test.ts'
      - '!**/*.test.tsx'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits and deploys the newer commit.
concurrency:
  group: web-deploy
  cancel-in-progress: false

env:
  SHA: ${{ github.sha }}
  GH_TOKEN: ${{ github.token }}
  SITE: https://app.masterdeck.dev

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
      pull-requests: write
      issues: write # the comment on the merged PR
    env:
      # Secrets cannot be read in a step's `if`.
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: No Cloudflare token
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice::The web app is not deployed (set the secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID). docs/OPERATIONS.md § Web app deploy."
      - name: Status pending
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context='Web deploy' \
            -f description='Deploying app.masterdeck.dev' -f target_url="$RUN_URL" > /dev/null
      - uses: actions/checkout@v4
        if: env.HAS_CLOUDFLARE == 'true'
      - uses: ./.github/actions/setup-app
        if: env.HAS_CLOUDFLARE == 'true'
      - name: Build
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: app
        run: npm run build:web
        env:
          MD_API: https://dev.masterdeck.dev
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        working-directory: app
        run: npx --yes wrangler@4 deploy -c web/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The built index.html names its hashed bundle: the live one must name the same.
      - name: Smoke check
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          set -euo pipefail
          want="$(grep -oE -m1 '/assets/index-[A-Za-z0-9_-]+\.js' app/out/web/index.html || true)"
          [ -n "$want" ] || { echo "::error::no bundle named in out/web/index.html"; exit 1; }
          page="$RUNNER_TEMP/index.html"
          for _ in 1 2 3 4 5 6; do
            if curl -fsS -o "$page" "$SITE/?smoke=$SHA" && grep -qF "$want" "$page" && curl -fsS -o /dev/null "$SITE$want"; then
              echo "$SITE serves $want"; exit 0
            fi
            sleep 10
          done
          echo "::error::$SITE does not serve $want after the deploy"; exit 1
      - name: Status and PR comment
        if: always() && env.HAS_CLOUDFLARE == 'true'
        run: |
          set -euo pipefail
          status() {
            gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$1" -f context='Web deploy' \
              -f description="$2" -f target_url="$RUN_URL" > /dev/null
          }
          if [ "$JOB" = success ]; then status success "Deployed app.masterdeck.dev"; exit 0; fi
          status failure "The web app deploy failed"
          msg="The web app deploy of this merge failed, so app.masterdeck.dev may still serve the previous version. Run: $RUN_URL

          Fix and merge again, or **Re-run failed jobs**. See docs/OPERATIONS.md § Web app deploy."
          for pr in $(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq '.[] | select(.merged_at != null) | .number' || true); do
            gh pr comment "$pr" -R "$GITHUB_REPOSITORY" --body "$msg" || true
          done
        env:
          JOB: ${{ job.status }}
