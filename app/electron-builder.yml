appId: io.github.amntoppo.masterdeck
productName: MasterDeck
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.test.*"
asarUnpack:
  - "**/node_modules/node-pty/**"
extraResources:
  - from: resources/statusline_tee.py
    to: statusline_tee.py
  # The Claude Code skills MasterDeck installs into ~/.claude/skills on first launch.
  - from: ../skills
    to: skills
    filter:
      - "**/*"
      - "!**/tests/**"
      - "!**/__pycache__/**"
      - "!**/.pytest_cache/**"
  # MasterDeck's Claude Code mods, copied into ~/.claude/masterdeck/mods (a local-folder marketplace).
  - from: ../mods
    to: mods
    filter:
      - "**/*"
      - "!**/*.test.ts"
      - "!shared/**"
      - "!sync-shared.sh"
npmRebuild: true
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signed ("-"): no Apple account needed. A whole-bundle signature binds the bundle id,
  # which macOS needs to register the app for notifications (a linker-only signature does not).
  # A Developer ID certificate (CSC_LINK / CSC_KEY_PASSWORD) would replace this.
  identity: "-"
  # Hardened runtime is for notarization (Developer ID); with an ad-hoc signature it would block
  # loading the app's own libraries.
  hardenedRuntime: false
  # Meetings (Settings → Meetings, after consent): without the microphone key macOS ends the app
  # on access; without the audio capture key the Mac's sound records as silence (macOS 14.2+).
  extendInfo:
    NSMicrophoneUsageDescription: MasterDeck records meetings only when you press Record.
    NSAudioCaptureUsageDescription: MasterDeck records meetings only when you press Record.
  # Meetings' speech engine, built by scripts/whisper.sh (CI runs it before dist:mac): each
  # architecture's DMG carries its own whisper-cli. Missing (a local build without the script):
  # Settings → Meetings says "Speech engine missing".
  extraResources:
    - from: resources/whisper/${arch}
      to: whisper/${arch}
      filter:
        - whisper-cli
    # The helper that reads the meeting app's mute, built by scripts/mute.sh (CI runs it too).
    # Missing: the recording keeps the microphone, as with "Always record".
    - from: resources/mute/${arch}
      to: mute/${arch}
      filter:
        - md-mute
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
